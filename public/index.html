<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CinemaRoom</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>
  <div id="danmaku"></div>
  <div id="chat" hidden></div>
  <div id="center" hidden><div id="center-text"></div></div>

  <div id="top" class="bar">
    <div id="title">CinemaRoom</div>
    <div id="viewers"></div>
    <button id="btn-queue" class="icon" title="清單">☰</button>
  </div>

  <div id="bottom" class="bar">
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <div class="row">
      <button id="btn-prev" class="icon" title="從頭播放">⏮</button>
      <button id="btn-play" class="icon" title="播放／暫停">▶</button>
      <button id="btn-next" class="icon" title="下一個">⏭</button>
      <span id="time">0:00 / 0:00</span>
      <span class="grow"></span>
      <button id="btn-dm" class="pill on" title="彈幕開關">彈</button>
      <button id="btn-dmset" class="icon" title="彈幕設定">⚙</button>
      <button id="btn-chatmode" class="pill" title="聊天室顯示方式" hidden>側邊</button>
      <input id="volume" type="range" min="0" max="100" value="80" title="音量（只影響你自己）">
    </div>
  </div>

  <div id="dmset" hidden>
    <div class="set-row"><span>大小</span><input id="dm-size" type="range" min="50" max="200" step="10"><b id="dm-size-v"></b></div>
    <div class="set-row"><span>不透明度</span><input id="dm-opacity" type="range" min="10" max="100" step="5"><b id="dm-opacity-v"></b></div>
    <div class="set-row"><span>顯示範圍</span>
      <div class="seg" id="dm-area">
        <button data-v="0.25">1/4</button><button data-v="0.5">半屏</button><button data-v="0.75">3/4</button><button data-v="1">全屏</button>
      </div>
    </div>
    <div class="set-note">只影響你自己的畫面</div>
  </div>

  <aside id="queue" hidden>
    <div class="qhead"><b>播放清單</b><button id="btn-close" class="icon" title="關閉">✕</button></div>
    <form id="add">
      <input id="add-url" type="url" placeholder="貼上影片、直播或播放清單的網址（B站／niconico／YouTube 直播）" autocomplete="off" required>
      <button type="submit" class="pill on">加入</button>
    </form>
    <div id="preview" hidden>
      <div class="th" id="pv-th"></div>
      <div class="pv-body"><div class="t" id="pv-title"></div><div class="s" id="pv-meta"></div></div>
    </div>
    <div id="qgroup" hidden><button id="qgroup-back" class="pill">← 返回</button><b id="qgroup-title"></b></div>
    <ol id="items"></ol>
    <div id="hint">誰都可以加入、跳過、暫停，大家看到的是同一個畫面。</div>
  </aside>

  <div id="toast" hidden></div>
</div>
<script src="vendor/hls.min.js?v=1"></script>
<script type="module" src="app.js?v=5"></script>
</body>
</html>
